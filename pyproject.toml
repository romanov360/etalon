[project]
name = "etalon"
version = "0.1.0"
description = "Etalon — an open-source silicon photonics design toolkit: material models, waveguide mode solvers, S-matrix photonic circuit simulation, optical link budgets for AI-datacenter interconnects (co-packaged optics, pluggables), and Monte Carlo yield analysis for photonic integrated circuits (PICs)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tristan Romanov" }]
keywords = [
    "silicon photonics",
    "photonic integrated circuit",
    "PIC",
    "photonics",
    "photonic EDA",
    "co-packaged optics",
    "CPO",
    "optical interconnect",
    "optical transceiver",
    "link budget",
    "ring resonator",
    "mode solver",
    "S-parameters",
    "circuit simulation",
    "Monte Carlo",
    "WDM",
    "datacom",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.urls]
Homepage = "https://github.com/romanov360/etalon"
Repository = "https://github.com/romanov360/etalon"
Changelog = "https://github.com/romanov360/etalon/blob/master/CHANGELOG.md"
Issues = "https://github.com/romanov360/etalon/issues"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    # Typing-only, and it requires 3.12+. The published package supports
    # 3.10+; mypy runs on the newest interpreter in CI, so gate it there.
    "scipy-stubs>=1.18.0.1; python_version >= '3.12'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etalon"]

# The sdist ships the library and its proof-of-correctness (tests, runnable
# examples), not the 18 MB research corpus under docs/research/ — that is
# repo material, not package material.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.coverage.run]
source = ["etalon"]
branch = true

[tool.coverage.report]
precision = 1
skip_covered = false
