[project]
name = "siphon"
version = "0.1.0"
description = "SiPhon — an open silicon photonics design toolkit: material models, mode solvers, S-matrix circuit simulation, and optical link budgets for AI-datacenter interconnects."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siphon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
