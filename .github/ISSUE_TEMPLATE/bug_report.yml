name: Bug report
description: Something in the code is wrong — a crash, a wrong number, an inconsistency.
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What you expected (with numbers, if applicable) vs. what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Etalon version / commit
      description: "`python -c 'import etalon; print(etalon.__version__)'` or the git commit hash"
    validations:
      required: false
