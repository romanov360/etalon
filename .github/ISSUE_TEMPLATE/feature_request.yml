name: Feature / new module request
description: Propose a new capability or physical model.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What's missing
      description: What capability, and what real use case needs it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: >-
        See CONTRIBUTING.md's "Scope" section first. Closed-form/semi-analytic
        preferred; state explicitly what the model would and would NOT
        capture.
    validations:
      required: false
