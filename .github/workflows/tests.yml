name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v

      - name: Run examples (smoke test)
        run: |
          for f in examples/*.py; do
            echo "=== $f ==="
            uv run python "$f"
          done
