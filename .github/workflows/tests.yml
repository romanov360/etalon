name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # The full suite on every Python the package claims to support, so
  # `requires-python` in pyproject.toml stays an audited claim, not a guess.
  matrix-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest -q

  # Typechecking, coverage, examples and docs run once, on the newest version.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync

      - name: Type check
        run: uv run mypy src/etalon

      - name: Run tests with coverage
        run: uv run pytest -v --cov=etalon --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Run examples (smoke test)
        run: |
          for f in examples/*.py; do
            echo "=== $f ==="
            uv run python "$f"
          done

      - name: Build docs site
        run: uv run mkdocs build --strict
